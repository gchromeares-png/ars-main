name: WIP SeleniumBase validation

on:
  push:
    branches:
      - wip/seleniumbase-cleanup-no-ci
    paths:
      - package.json
      - .github/workflows/wip-seleniumbase-validation.yml
      - requirements-seleniumbase-cdp.txt
      - requirements-seleniumbase-vision.txt
      - requirements-slider-vision-optional.txt
      - src/**
      - tests/**
      - python/**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout WIP branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Guard active tree against Patchright and sql.js legacy
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=node_modules --exclude='MIGRATION-PATCHRIGHT.md' -E 'patchright|sql\.js' src tests package.json package-lock.json; then
            echo "Legacy Patchright/sql.js reference found in active code, tests, types or lockfile."
            exit 1
          fi

      - name: Commit regenerated lockfile to WIP if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "wip: regenerate lockfile without Patchright"
          git push origin HEAD:wip/seleniumbase-cleanup-no-ci

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install SeleniumBase CDP dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Compile all SeleniumBase Python sources
        run: python -m compileall -q python/seleniumbase_cdp

      - name: Run SeleniumBase Python probes
        shell: bash
        run: |
          set -euo pipefail
          probes=(
            stable_marks_probe.py
            visual_grounding_probe.py
            composite_slider_grounder_probe.py
            ddddocr_slider_provider_probe.py
            interaction_outcome_probe.py
            interaction_orchestrator_probe.py
            visual_event_trigger_probe.py
            observation_policy_probe.py
            test_readiness_grid_probe.py
            instruction_input_probe.py
            semantic_interaction_probe.py
            challenge_state_tracker_probe.py
            site_grid_adapter_probe.py
            authorized_grid_action_executor_probe.py
            auto_interaction_probe.py
            persistence_probe.py
            manual_profile_probe.py
            reopen_profile_probe.py
          )
          for probe in "${probes[@]}"; do
            echo "==> $probe"
            python "python/seleniumbase_cdp/$probe"
          done

      - name: Build TypeScript backend
        run: npm run build:backend

      - name: Run full Jest suite including browser integrations
        env:
          ARES_RUN_BROWSER_INTEGRATION: "1"
        run: npm test -- --runInBand

      - name: Final active-tree legacy guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=node_modules --exclude='MIGRATION-PATCHRIGHT.md' -E 'patchright|sql\.js' src tests package.json package-lock.json; then
            exit 1
          fi
