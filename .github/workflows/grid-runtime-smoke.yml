name: Grid Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/grid-smoke-run-20260906

jobs:
  delayed-grid-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SeleniumBase CDP runtime
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Prepare real SigLIP2 vision runtime
        run: python python/seleniumbase_cdp/vision_runtime_bootstrap.py --prepare

      - name: Compile smoke probe
        run: python -m py_compile python/seleniumbase_cdp/grid_runtime_smoke_probe.py

      - name: Diagnostic delay fixture beyond worker startup
        shell: pwsh
        run: |
          $path = 'python/seleniumbase_cdp/grid_runtime_smoke_probe.py'
          $content = Get-Content $path -Raw
          $content = $content.Replace('}}, 2800);', '}}, 15000);')
          Set-Content -Path $path -Value $content -Encoding utf8

      - name: Run delayed iframe grid smoke variants through real SigLIP2
        run: python python/seleniumbase_cdp/grid_runtime_smoke_probe.py
