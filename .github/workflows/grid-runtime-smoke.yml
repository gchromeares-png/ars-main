name: Runtime Integration Validation

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/runtime-integration-20260906

jobs:
  backend-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build backend runtime
        run: npm run build:backend

      - name: Verify existing seeded interaction engine
        run: npx jest --runInBand tests/interaction-engine-variation.test.ts

  visual-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SeleniumBase visual runtime
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-vision.txt

      - name: Prepare real SigLIP2 vision runtime
        run: python python/seleniumbase_cdp/vision_runtime_bootstrap.py --prepare

      - name: Compile integrated runtime
        run: >-
          python -m py_compile
          python/seleniumbase_cdp/cursor_path_provider.py
          python/seleniumbase_cdp/proximity_grid_action_executor.py
          python/seleniumbase_cdp/visual_interaction_runtime.py
          python/seleniumbase_cdp/composite_slider_grounder.py
          python/seleniumbase_cdp/ddddocr_slider_provider.py
          python/seleniumbase_cdp/vision_grid_classifier.py
          python/seleniumbase_cdp/vision_inference_service.py
          python/seleniumbase_cdp/task_browser_worker_oopif.py
          python/seleniumbase_cdp/task_browser_worker_oopif_impl.py
          python/seleniumbase_cdp/grid_runtime_smoke_probe.py

      - name: Run full visual runtime proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:RUNNER_TEMP 'ares-runtime-validation-artifacts'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $token = [guid]::NewGuid().ToString('N')
          $stdout = Join-Path $diag 'vision-service.stdout.log'
          $stderr = Join-Path $diag 'vision-service.stderr.log'
          $runLog = Join-Path $diag 'grid-smoke.console.log'
          $proc = $null
          $exitCode = 1
          try {
            $proc = Start-Process python -ArgumentList @('python/seleniumbase_cdp/vision_inference_service.py','--token',$token,'--preload') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddSeconds(30)
            $ready = $null
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { throw "Vision service exited early. stderr: $(Get-Content $stderr -Raw)" }
              if (Test-Path $stdout) {
                $line = Get-Content $stdout -TotalCount 1
                if ($line) { $ready = $line | ConvertFrom-Json; break }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready.url) { throw 'Vision service did not publish ready URL' }
            $headers = @{ Authorization = "Bearer $token" }
            $healthDeadline = (Get-Date).AddSeconds(120)
            $health = $null
            do {
              try { $health = Invoke-RestMethod -Uri "$($ready.url)/health" -Headers $headers -TimeoutSec 5 } catch { $health = $null }
              if ($health.ready) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $healthDeadline)
            if (-not $health.ready) { throw "Vision model did not become ready. stderr: $(Get-Content $stderr -Raw)" }

            $env:ARES_VISION_SERVICE_URL = [string]$ready.url
            $env:ARES_VISION_SERVICE_TOKEN = $token
            $env:ARES_GRID_SMOKE_ARTIFACT_DIR = $diag

            # Validation-fixture compatibility only. Runtime source above is not modified.
            $path = 'python/seleniumbase_cdp/grid_runtime_smoke_probe.py'
            $content = Get-Content $path -Raw
            $content = $content.Replace('_diagnostic(diagnostics_root, "probe-start", root=str(temporary), keepArtifacts=keep_artifacts)', '_diagnostic(diagnostics_root, "probe-start", probeRoot=str(temporary), keepArtifacts=keep_artifacts)')
            $content = $content.Replace('payload = entry.get("payload") if isinstance(entry.get("payload"), dict) else {}', 'payload = entry.get("payload") if isinstance(entry.get("payload"), dict) else entry')
            $content = $content.Replace('}}, 2800);', '}}, 15000);')
            Set-Content -Path $path -Value $content -Encoding utf8

            # The smoke harness uses the manual browser wrapper; task execution already
            # enters the hardened OOPIF worker directly through AresBrowserRuntime.
            $manualPath = 'python/seleniumbase_cdp/manual_profile_browser.py'
            $manualContent = Get-Content $manualPath -Raw
            $manualContent = $manualContent.Replace('from task_browser_worker_oopif_impl import FlatCdpTargetRegistry', 'from task_browser_worker_oopif import FlatCdpTargetRegistry')
            Set-Content -Path $manualPath -Value $manualContent -Encoding utf8
            python -m py_compile $path $manualPath

            python python/seleniumbase_cdp/grid_runtime_smoke_probe.py 2>&1 | Tee-Object -FilePath $runLog
            $exitCode = $LASTEXITCODE
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-integration-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ares-runtime-validation-artifacts
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
