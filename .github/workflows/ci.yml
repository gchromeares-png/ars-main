name: ARES CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Patchright Chrome
        run: npm run browser:install -- --with-deps

      - name: Build backend
        run: npm run build:backend

      - name: Build UI
        run: npm run build:ui

      - name: Run tests
        env:
          ARES_RUN_BROWSER_INTEGRATION: "1"
        run: npm test -- --runInBand
