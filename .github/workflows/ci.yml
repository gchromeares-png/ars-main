name: ARES CI

on:
  push:
    branches: [main, work/payment-contract-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Patchright Chrome
        run: npm run browser:install -- --with-deps

      - name: Run targeted payment gates
        env:
          ARES_RUN_BROWSER_INTEGRATION: "1"
        run: >-
          npx jest --runInBand
          tests/payment-session-normalizer.test.ts
          tests/profile-payment-vault.test.ts
          tests/ephemeral-payment-executor.test.ts
          tests/payment-persistence-safety.test.ts
          tests/payment-preparation.test.ts
          tests/payment-fixture.integration.test.ts
          tests/payment-source-guard.test.ts

      - name: Build backend
        run: npm run build:backend

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"

          setsid bash -lc 'npm run build:ui' > >(tee "$log_file") 2>&1 &
          build_pid=$!

          cleanup() {
            kill -TERM -- "-$build_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$build_pid" 2>/dev/null || true
            wait "$build_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 120); do
            if grep -q "Build at:" "$log_file" && test -f dist/ares/index.html; then
              echo "Angular build output verified; terminating any lingering CLI process."
              exit 0
            fi

            if ! kill -0 "$build_pid" 2>/dev/null; then
              set +e
              wait "$build_pid"
              status=$?
              set -e
              if [ "$status" -eq 0 ] && test -f dist/ares/index.html; then
                echo "Angular build exited normally and output was verified."
                exit 0
              fi
              echo "Angular build exited with status $status before a valid output was produced."
              exit "$status"
            fi

            sleep 1
          done

          echo "Angular build did not produce a verified output within 120 seconds."
          exit 1

      - name: Run full test suite
        env:
          ARES_RUN_BROWSER_INTEGRATION: "1"
        run: npm test -- --runInBand

      - name: Upload auto-checkout test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-checkout-parallel-screenshot
          path: test-artifacts/auto-checkout-parallel.png
          if-no-files-found: ignore
