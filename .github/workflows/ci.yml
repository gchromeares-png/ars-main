name: ARES CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ares-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-focus:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-seleniumbase-cdp.txt

      - name: Install SeleniumBase runtime
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Compile changed runtime surface
        run: >-
          python -m py_compile
          python/seleniumbase_cdp/product_monitor_browser.py
          python/seleniumbase_cdp/product_monitor_browser_e2e_probe.py
          python/seleniumbase_cdp/task_rpc_navigation_probe.py
          python/seleniumbase_cdp/oopif_seed_slider_probe.py
          python/seleniumbase_cdp/slider_feedback_control_probe.py
          python/seleniumbase_cdp/grid_scope_lifecycle_probe.py
          python/seleniumbase_cdp/consent_popup_handler.py
          python/seleniumbase_cdp/instruction_input_runtime.py
          python/seleniumbase_cdp/extended_grid_site_adapter.py
          python/seleniumbase_cdp/scope_locked_grid_site_adapter.py
          python/seleniumbase_cdp/runtime_oopif_grid_site_adapter.py
          python/seleniumbase_cdp/runtime_oopif_outcome_grid_site_adapter.py
          python/seleniumbase_cdp/runtime_sprite_grid_probe.py
          python/seleniumbase_cdp/oopif_visual_interaction_runtime.py
          python/seleniumbase_cdp/control_aware_seleniumbase_adapter.py
          python/seleniumbase_cdp/site_grid_adapter.py
          python/seleniumbase_cdp/site_slider_adapter.py
          python/seleniumbase_cdp/slider_action_executor.py
          python/seleniumbase_cdp/cursor_path_provider.py
          python/seleniumbase_cdp/runtime_identity.py
          python/seleniumbase_cdp/seleniumbase_adapter.py
          python/seleniumbase_cdp/task_browser_worker_oopif.py
          python/seleniumbase_cdp/auto_interaction_controller.py
          python/seleniumbase_cdp/auto_interaction_probe.py
          python/seleniumbase_cdp/runtime_nested_oopif_grid_e2e_probe.py
          python/seleniumbase_cdp/runtime_nested_oopif_grid_e2e_runner.py
          python/seleniumbase_cdp/observation_capture.py
          python/seleniumbase_cdp/observation_capture_active_tab_probe.py

      - name: Verify active manual tab owns screenshots
        run: python python/seleniumbase_cdp/observation_capture_active_tab_probe.py

      - name: Verify instruction and math runtime
        run: python python/seleniumbase_cdp/instruction_input_probe.py

      - name: Verify structural grid adapter
        run: python python/seleniumbase_cdp/site_grid_adapter_probe.py

      - name: Verify 4x4 sprite visuals use interactive cell geometry
        run: python python/seleniumbase_cdp/runtime_sprite_grid_probe.py

      - name: Verify nested visual-ancestor OOPIF runtime
        run: python python/seleniumbase_cdp/runtime_nested_oopif_grid_e2e_runner.py

      - name: Verify grid scope lifecycle
        run: python python/seleniumbase_cdp/grid_scope_lifecycle_probe.py

      - name: Verify task-seeded OOPIF slider runtime
        run: python python/seleniumbase_cdp/oopif_seed_slider_probe.py

      - name: Verify slider feedback control
        run: python python/seleniumbase_cdp/slider_feedback_control_probe.py

      - name: Verify automatic interaction contract
        run: python python/seleniumbase_cdp/auto_interaction_probe.py

      - name: Verify task RPC navigation responsiveness
        run: python python/seleniumbase_cdp/task_rpc_navigation_probe.py

      - name: Run real JavaScript storefront monitor E2E
        env:
          ARES_MONITOR_E2E_MODE: "visible"
        run: python python/seleniumbase_cdp/product_monitor_browser_e2e_probe.py

  node-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python for session HTTP E2E
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-seleniumbase-cdp.txt

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install session HTTP runtime
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Verify real CDP to curl_cffi queue chain
        env:
          ARES_RUN_BROWSER_INTEGRATION: "1"
        run: npx jest --runInBand tests/queue-monitor-session-http.integration.test.ts

      - name: Verify GhostCursor and Bezier providers
        run: node python/seleniumbase_cdp/cursor_path_helper_probe.cjs

      - name: Run focused production gates
        env:
          ARES_RUN_BROWSER_INTEGRATION: "1"
        run: >-
          npx jest --runInBand
          tests/payment-session-normalizer.test.ts
          tests/profile-payment-vault.test.ts
          tests/ephemeral-payment-executor.test.ts
          tests/payment-persistence-safety.test.ts
          tests/payment-preparation.test.ts
          tests/payment-readiness.test.ts
          tests/final-submit-recovery.test.ts
          tests/checkout-outcome-observer.test.ts
          tests/shopify-purchase-ready-executor.test.ts
          tests/retry-policy-block.test.ts
          tests/pokemon-center-final-purchase-guard.test.ts
          tests/task-lifecycle-safety.test.ts
          tests/payment-source-guard.test.ts
          tests/browser-gate-monitor-lanes.test.ts
          tests/queue-monitor-escalation.test.ts
          tests/queue-waiter.test.ts
          tests/profile-session-manager.test.ts
          tests/profile-browser-session-persistence.test.ts
          tests/commerce-monitor-browser-fallback.test.ts
          tests/seleniumbase-cdp-source-guard.test.ts

      - name: Build backend
        run: npm run build:backend

      - name: Build UI
        run: npm run build:ui
