name: ARES Browser Identity Parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "python/seleniumbase_cdp/browser_identity_parity_probe.py"
      - "python/seleniumbase_cdp/seleniumbase_adapter.py"
      - "python/seleniumbase_cdp/runtime_identity.py"
      - "requirements-seleniumbase-cdp.txt"
      - ".github/workflows/browser-identity-parity.yml"

concurrency:
  group: ares-browser-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stock-vs-ares:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-seleniumbase-cdp.txt

      - name: Install ARES browser runtime
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Compile parity probe
        run: python -m py_compile python/seleniumbase_cdp/browser_identity_parity_probe.py

      - name: Verify diff logic
        run: python python/seleniumbase_cdp/browser_identity_parity_probe.py --self-test

      - name: Verify Stock Chrome control has no automation flags
        shell: pwsh
        run: |
          $probe = Get-Content python/seleniumbase_cdp/browser_identity_parity_probe.py -Raw
          if ($probe -match 'remote-debugging-port' -or $probe -match '--enable-automation') {
            throw 'Stock control must not enable CDP/automation flags.'
          }

      - name: Run Stock Chrome vs ARES identity experiment
        run: >-
          python python/seleniumbase_cdp/browser_identity_parity_probe.py
          --seeds 101,202,303,404
          --viewport 1280,900
          --language en-US
          --output artifacts/browser-identity-parity/report.json

      - name: Upload identity parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-identity-parity
          path: artifacts/browser-identity-parity/report.json
          if-no-files-found: warn
          retention-days: 14
