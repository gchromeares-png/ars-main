name: WIP Final Validation

on:
  push:
    branches: [wip/seleniumbase-cleanup-no-ci]
    paths:
      - .github/workflows/wip-final-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WIP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Assert dependency cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude='MIGRATION-PATCHRIGHT.md' 'patchright' package.json package-lock.json src tests
          ! grep -RIn --exclude-dir=.git 'sql\.js' package.json package-lock.json src tests
          grep -q 'node_modules/better-sqlite3' package-lock.json

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build backend
        run: npm run build:backend

      - name: Run Jest
        env:
          ARES_RUN_BROWSER_INTEGRATION: '0'
        run: npm test -- --runInBand

      - name: Install SeleniumBase runtime deps
        run: python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Compile Python runtime
        run: python -m py_compile python/seleniumbase_cdp/*.py

      - name: Run Python probes
        shell: bash
        run: |
          set -euo pipefail
          python python/seleniumbase_cdp/challenge_state_tracker_probe.py
          python python/seleniumbase_cdp/stable_marks_probe.py
          python python/seleniumbase_cdp/visual_grounding_probe.py
          python python/seleniumbase_cdp/interaction_outcome_probe.py
          python python/seleniumbase_cdp/interaction_orchestrator_probe.py
          python python/seleniumbase_cdp/visual_event_trigger_probe.py
          python python/seleniumbase_cdp/observation_policy_probe.py
          python python/seleniumbase_cdp/test_readiness_grid_probe.py
          python python/seleniumbase_cdp/instruction_input_probe.py
          python python/seleniumbase_cdp/semantic_interaction_probe.py
          python python/seleniumbase_cdp/site_grid_adapter_probe.py
          python python/seleniumbase_cdp/authorized_grid_action_executor_probe.py
          python python/seleniumbase_cdp/auto_interaction_probe.py
          python python/seleniumbase_cdp/persistence_probe.py
          python python/seleniumbase_cdp/manual_profile_probe.py
          python python/seleniumbase_cdp/reopen_profile_probe.py

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'wip: regenerate package lock for SeleniumBase runtime'
            git push origin HEAD:wip/seleniumbase-cleanup-no-ci
          fi
