name: One-time Ollama semantic validation

on:
  push:
    branches:
      - one-time-ollama-validation
    paths:
      - .github/workflows/one-time-ollama-validation.yml

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # chromium.launch() without an explicit channel expects Patchright's
      # managed Chromium/headless-shell. The normal project browser:install
      # script installs system Chrome instead, which caused the previous run
      # to fail before Ollama was exercised.
      - name: Install Patchright managed Chromium
        timeout-minutes: 5
        run: npx patchright install chromium

      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2
        with:
          version: 0.33.2

      - name: Start Ollama on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then
              ollama --version
              exit 0
            fi
            sleep 1
          done
          cat ollama.log || true
          exit 1

      - name: Start Ollama on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'ollama' -ArgumentList 'serve' -WindowStyle Hidden -PassThru
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($process.HasExited) {
              throw "Ollama server exited early with code $($process.ExitCode)"
            }
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/version' -TimeoutSec 2 | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) { throw 'Ollama server did not become ready within 45 seconds' }
          ollama --version

      - name: Pull embedding model
        timeout-minutes: 5
        run: ollama pull embeddinggemma:300m-qat-q4_0

      - name: Verify Ollama embedding endpoint
        shell: pwsh
        run: |
          $payload = @{ model = 'embeddinggemma:300m-qat-q4_0'; input = @('semantic validation warmup') } | ConvertTo-Json -Compress
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/embed' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 30
          if (-not $response.embeddings -or $response.embeddings.Count -ne 1) {
            throw 'Ollama embedding warmup did not return exactly one embedding'
          }
          Write-Host "Ollama warmup OK; embedding dimensions: $($response.embeddings[0].Count)"

      - name: Run only the isolated real-Ollama test
        timeout-minutes: 5
        env:
          ARES_FIELD_EMBED_MODEL: embeddinggemma:300m-qat-q4_0
          ARES_FIELD_EMBED_ENDPOINT: http://127.0.0.1:11434/api/embed
        run: npx jest tests/one-time-ollama-semantic.integration.test.ts --runInBand
