name: Commerce Endpoint Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commerce-endpoint-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe documented commerce product endpoints
        shell: bash
        run: |
          set +e

          probe_get() {
            name="$1"
            url="$2"
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --connect-timeout 8 --max-time 15 \
              -H 'User-Agent: ARES-Endpoint-Smoke/1.0 (+read-only)' \
              "$url")
            ctype=$(curl -L -sS -I --connect-timeout 8 --max-time 15 \
              -H 'User-Agent: ARES-Endpoint-Smoke/1.0 (+read-only)' \
              "$url" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\\r",""); print $0}' | tail -1)
            echo "RESULT|$name|GET|$code|$url|$ctype"
          }

          probe_post_json() {
            name="$1"
            url="$2"
            body="$3"
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --connect-timeout 8 --max-time 15 \
              -X POST \
              -H 'User-Agent: ARES-Endpoint-Smoke/1.0 (+read-only)' \
              -H 'Content-Type: application/json' \
              --data "$body" \
              "$url")
            echo "RESULT|$name|POST|$code|$url"
          }

          echo '--- LIVE PROBES (read-only) ---'
          probe_get 'shopify-feenturm-products-json' 'https://feenturm.de/products.json?limit=1'
          probe_get 'woocommerce-official-storefront-demo' 'https://themes.woocommerce.com/storefront/wp-json/wc/store/v1/products?per_page=1'
          probe_post_json 'wix-products-query-no-auth' 'https://www.wixapis.com/stores/v3/products/query' '{"query":{}}'
          probe_get 'squarespace-products-no-auth' 'https://api.squarespace.com/v2/commerce/products'
          probe_get 'ecwid-doc-sample-store-no-auth' 'https://app.ecwid.com/api/v3/1003/products?limit=1'
          probe_get 'jtl-cloud-items-no-auth' 'https://api.jtl-cloud.com/erp/v2/items'
          probe_get 'commercetools-product-search-no-auth' 'https://api.europe-west1.gcp.commercetools.com/ares-smoke/product-projections/search'
          probe_get 'bigcommerce-catalog-no-auth' 'https://api.bigcommerce.com/stores/ares-smoke/v3/catalog/products?limit=1'

          echo '--- CONFIG-BOUND ENDPOINTS ---'
          echo 'SKIP|shopware|POST {shopBase}/store-api/product|requires sales-channel sw-access-key from that shop configuration'
          echo 'SKIP|prestashop|GET {shopBase}/api/products|requires shop Webservice API key'
          echo 'SKIP|magento-adobe-commerce|GET {shopBase}/rest/V1/products|anonymous catalog access is merchant/config dependent'
          echo 'SKIP|salesforce-commerce-cloud|Shopper Products API|requires tenant short-code/site ID and SLAS client/token'
          echo 'SKIP|jtl-shop|shop-specific storefront endpoint|no universal anonymous JTL-Shop product REST endpoint documented'

          exit 0
