<!doctype html>
<html lang="de">
  <body>
    <section aria-label="Zahlung">
      <label>Kreditkarte <input type="radio" name="payment" value="card" checked></label>
      <label>Karteninhaber <input id="cardholder" autocomplete="cc-name" name="cardholderName"></label>
      <label>Kartennummer <input id="card-number" autocomplete="cc-number" name="cardNumber"></label>
      <label>Ablaufdatum <input id="expiry" autocomplete="cc-exp" name="expiry"></label>
      <label>CVC <input id="cvc" autocomplete="cc-csc" name="cvc"></label>
    </section>
  </body>
</html>
