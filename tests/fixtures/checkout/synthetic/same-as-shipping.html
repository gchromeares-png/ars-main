<!doctype html>
<html lang="de">
<body>
  <main>
    <section aria-label="Lieferanschrift">
      <label>Vorname <input data-slot="shipping-first" autocomplete="shipping given-name"></label>
      <label>Nachname <input data-slot="shipping-last" autocomplete="shipping family-name"></label>
      <label>Straße und Hausnummer <input data-slot="shipping-address" autocomplete="shipping address-line1"></label>
      <label>PLZ <input data-slot="shipping-postal" autocomplete="shipping postal-code"></label>
      <label>Ort <input data-slot="shipping-city" autocomplete="shipping address-level2"></label>
    </section>
    <label>
      <input type="checkbox" data-slot="same-as-shipping">
      Rechnungsadresse entspricht Lieferadresse
    </label>
  </main>
</body>
</html>
